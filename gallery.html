<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMOC Gallery - คลังดาวน์โหลดรูปภาพกิจกรรม</title>
<meta name="description" content="ภาพถ่ายโดย สำนักงานการตลาดและสื่อสารองค์กร มหาวิทยาลัยพายัพ พร้อมดาวน์โหลดไฟล์คุณภาพสูงบน OneDrive">
<meta property="og:title" content="OMOC Gallery - คลังดาวน์โหลดรูปภาพกิจกรรม">
<meta property="og:description" content="ภาพถ่ายโดย สำนักงานการตลาดและสื่อสารองค์กร มหาวิทยาลัยพายัพ พร้อมดาวน์โหลดไฟล์คุณภาพสูงบน OneDrive">
<meta property="og:type" content="website">
<meta property="og:site_name" content="OMOC Photo Gallery">

<style>
  /* ============ Custom Font: FC Vision ============ */
  @font-face {
    font-family: "FC Vision";
    src: url("Font/FCVision-Regular.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: "FC Vision";
    src: url("Font/FCVision-SemiBold.woff2") format("woff2");
    font-weight: 600;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: "FC Vision";
    src: url("Font/FCVision-Bold.woff2") format("woff2");
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: "FC Vision";
    src: url("Font/FCVision-Bold.woff2") format("woff2");
    font-weight: 800;
    font-style: normal;
    font-display: swap;
  }

  /* ============ Design tokens ============ */
  :root {
    --primary: #004e8b;
    --primary-2: #0066b3;
    --blue: #0072bb;
    --gold: #db9b00;
    --bg: #f6f8fc;
    --card: rgba(255, 255, 255, .82);
    --ink: #14202e;
    --muted: #5d6877;
    --line: #e7ecf3;
    --green: #0f9d6b;
    --green-soft: #e7f6ef;
    --amber: #f59e0b;
    --amber-soft: #fff5de;
    --danger: #e0452f;
    --radius: 24px;
    --shadow: 0 1px 2px rgba(16, 40, 70, .04), 0 18px 40px -18px rgba(16, 40, 70, .18);
    --ease: cubic-bezier(.16, 1, .3, 1);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  [hidden] { display: none !important; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "FC Vision", "Noto Sans Thai", "Sarabun", "Leelawadee UI", "Thonburi", "Tahoma", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.55;
    overflow-x: hidden;
  }

  button, input, select, textarea {
    font-family: inherit;
    color: inherit;
  }

  button { cursor: pointer; }
  button:focus-visible, input:focus-visible {
    outline: 3px solid rgba(0, 114, 187, .35);
    outline-offset: 2px;
  }

  .ico { display: inline-flex; width: 1.15em; height: 1.15em; flex-shrink: 0; }
  .ico svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ============ Ambient background ============ */
  .ambient { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .55; will-change: transform; }
  .orb.o1 { width: 520px; height: 520px; background: rgba(0, 114, 187, .16); top: -180px; left: -140px; animation: drift 24s ease-in-out infinite alternate; }
  .orb.o2 { width: 460px; height: 460px; background: rgba(219, 155, 0, .14); bottom: -160px; right: -120px; animation: drift 28s ease-in-out infinite alternate-reverse; }
  .watermark {
    position: absolute; width: min(1100px, 150vw); opacity: .018; user-select: none;
    will-change: transform;
  }
  .watermark.w1 { top: -20%; left: -25%; animation: float1 40s ease-in-out infinite alternate; }
  .watermark.w2 { bottom: -25%; right: -35%; animation: float2 46s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translate3d(80px, 60px, 0) scale(1.12); } }
  @keyframes float1 { to { transform: translate3d(90px, 70px, 0) rotate(10deg) scale(1.06); } }
  @keyframes float2 { to { transform: translate3d(-110px, -60px, 0) rotate(-12deg) scale(.94); } }

  .page { position: relative; z-index: 1; }
  .wrap { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 20px; }

  @media (min-width: 1024px) {
    .wrap { max-width: 1680px; padding: 0 clamp(20px, 3vw, 48px); }
  }

  /* ============ Header ============ */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: rgba(255, 255, 255, .72);
    backdrop-filter: saturate(1.6) blur(14px);
    -webkit-backdrop-filter: saturate(1.6) blur(14px);
    border-bottom: 1px solid var(--line);
    animation: slideDown .7s var(--ease) both;
  }
  .topbar .wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    padding-top: 14px;
    padding-bottom: 14px;
  }
  .brand-logo {
    height: 50px;
    width: auto;
    object-fit: contain;
    user-select: none;
    transition: transform .25s var(--ease);
  }
  .brand-logo:hover {
    transform: scale(1.03);
  }
  .logo-fallback {
    width: 50px;
    height: 50px;
    border-radius: 14px;
    background: var(--primary);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 13px;
    line-height: 1;
    flex-shrink: 0;
  }
  .logo-fallback small { font-size: 8px; letter-spacing: .18em; color: var(--gold); margin-top: 3px; }

  /* ============ Hero ============ */
  .hero {
    padding: 16px 0 8px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    animation: fadeUp .8s .1s var(--ease) both;
  }
  .hero h2 {
    margin: 0 auto 6px;
    font-size: clamp(1.6rem, 4vw, 2.3rem);
    font-weight: 800;
    letter-spacing: normal;
    line-height: 1.4;
    color: var(--ink);
  }
  .hero h2 span {
    display: inline-block;
    padding-top: 0.12em;
    padding-bottom: 0.35em;
    margin-top: -0.12em;
    margin-bottom: -0.35em;
    vertical-align: baseline;
    color: var(--primary);
    background: linear-gradient(90deg, var(--primary), var(--blue));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .hero p {
    margin: 0 auto;
    max-width: 620px;
    color: var(--muted);
    font-size: .95rem;
    line-height: 1.5;
  }

  /* ============ Layout ============ */
  .layout {
    display: flex;
    flex-direction: column;
    gap: 24px;
    padding: 12px 0 32px;
    align-items: stretch;
    width: 100%;
    min-width: 0;
  }

  .panel {
    background: var(--card);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, .9);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px 28px;
    width: 100%;
    min-width: 0;
  }
  .side.panel { animation: fadeUp .8s .2s var(--ease) both; min-width: 0; }
  .main-col.panel { animation: fadeUp .8s .3s var(--ease) both; min-height: 240px; min-width: 0; }

  /* Two-column Split: Exactly 50% Left fixed calendar stretched to browser bottom, 50% Right independently scrollable details */
  @media (min-width: 1024px) {
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 28px;
      align-items: stretch;
      padding: 8px 0 20px;
    }
    .side.panel {
      position: sticky;
      top: 80px;
      z-index: 10;
      min-width: 0;
      width: 100%;
      height: calc(100dvh - 195px);
      min-height: 560px;
      display: flex;
      flex-direction: column;
    }
    #calendar-skeleton {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    #calendar-box {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      width: 100%;
    }
    .days {
      grid-auto-rows: 1fr;
      flex: 1;
      min-height: 0;
      align-content: stretch;
    }
    .days .day, .days .day-empty {
      height: 100%;
      min-height: 44px;
    }
    .legend {
      margin-top: auto;
      padding-top: 14px;
      flex-shrink: 0;
    }
    .main-col.panel {
      min-width: 0;
      width: 100%;
      height: calc(100dvh - 195px);
      min-height: 560px;
      max-height: calc(100dvh - 195px);
      overflow-y: auto;
      overscroll-behavior: contain;
      padding-right: 18px;
      scrollbar-width: thin;
      scrollbar-color: rgba(0, 78, 139, .25) transparent;
    }
    .main-col.panel::-webkit-scrollbar {
      width: 6px;
    }
    .main-col.panel::-webkit-scrollbar-track {
      background: transparent;
    }
    .main-col.panel::-webkit-scrollbar-thumb {
      background: rgba(0, 78, 139, .25);
      border-radius: 999px;
    }
    .main-col.panel::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 78, 139, .45);
    }
  }

  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 18px;
    width: 100%;
    min-width: 0;
  }
  .panel-title { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 1rem; font-weight: 700; color: var(--primary); }
  .panel-title .ico { color: var(--gold); font-size: 1.25rem; }

  /* Year stepper */
  .stepper { display: inline-flex; align-items: center; gap: 2px; background: #eef2f8; border-radius: 999px; padding: 3px; }
  .stepper button {
    width: 30px; height: 30px; border: 0; border-radius: 50%; background: transparent; color: var(--primary);
    display: inline-flex; align-items: center; justify-content: center; transition: background .2s, transform .2s;
  }
  .stepper button:hover { background: #fff; transform: scale(1.06); }
  .stepper output { min-width: 82px; text-align: center; font-size: .84rem; font-weight: 700; color: var(--ink); }

  /* Month chips */
  .months {
    position: relative;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 4px 14px;
    width: 100%;
    min-width: 0;
    scrollbar-width: none;
    -ms-overflow-style: none;
    mask-image: linear-gradient(90deg, transparent 0, #000 16px, #000 calc(100% - 16px), transparent 100%);
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 16px, #000 calc(100% - 16px), transparent 100%);
  }
  .months::-webkit-scrollbar { display: none; }
  .chip-month {
    position: relative; flex-shrink: 0; border: 0; padding: 8px 18px; border-radius: 999px;
    background: #eef2f8; color: var(--muted); font-size: .86rem; font-weight: 600;
    transition: background .25s var(--ease), color .25s, transform .25s var(--ease), box-shadow .25s;
  }
  .chip-month:hover { background: #e2e9f3; transform: translateY(-1px); }
  .chip-month.active { background: var(--primary); color: #fff; box-shadow: 0 8px 18px -8px rgba(0, 78, 139, .7); }
  .chip-month.has::after {
    content: ""; position: absolute; top: 5px; right: 7px; width: 5px; height: 5px; border-radius: 50%; background: var(--gold);
  }
  .chip-month.active.has::after { background: #ffd978; }

  /* Calendar */
  .cal-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 16px 0 14px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    width: 100%;
    min-width: 0;
  }
  .cal-label {
    font-size: clamp(1.35rem, 3.2vw, 1.7rem);
    font-weight: 800;
    color: var(--primary);
    letter-spacing: -.01em;
    line-height: 1.2;
  }
  .today-btn {
    border: 1px solid var(--line); background: #fff; color: var(--blue); font-size: .8rem; font-weight: 700;
    padding: 6px 16px; border-radius: 999px; transition: all .25s var(--ease);
  }
  .today-btn:hover { border-color: var(--gold); color: var(--gold); transform: translateY(-1px); }

  .weekdays, .days {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 8px 10px;
    text-align: center;
    width: 100%;
    min-width: 0;
  }
  .weekdays {
    font-size: .82rem;
    font-weight: 700;
    color: var(--muted);
    padding-bottom: 10px;
    margin-bottom: 4px;
    border-bottom: 1px solid var(--line);
  }
  .weekdays div:first-child { color: #d0584a; }

  .day {
    position: relative;
    width: 100%;
    height: 46px;
    border: 1.5px solid transparent;
    border-radius: 14px;
    background: transparent;
    color: var(--ink);
    font-size: .95rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .25s var(--ease), background .25s, box-shadow .25s, color .25s, border-color .25s;
  }
  .day:hover {
    background: #eaf0f8;
    transform: translateY(-2px);
  }
  .day.is-today {
    border-color: var(--gold);
    box-shadow: 0 0 0 1px var(--gold);
  }
  .day.ready {
    background: var(--green-soft);
    color: #0a7a54;
    border-color: rgba(15, 157, 107, .28);
  }
  .day.ready:hover { background: #d3f0e3; }
  .day.upcoming {
    background: var(--amber-soft);
    color: #a56a00;
    border-color: rgba(245, 158, 11, .32);
  }
  .day.upcoming:hover { background: #ffecc2; }
  .day.other {
    background: rgba(219, 155, 0, .12);
    color: var(--blue);
    border-color: rgba(219, 155, 0, .32);
  }
  .day.selected {
    background: var(--primary);
    color: #fff;
    border-color: transparent;
    transform: translateY(-2px);
    box-shadow: 0 10px 22px -8px rgba(0, 78, 139, .65);
    z-index: 2;
  }
  .day .dot {
    position: absolute;
    bottom: 5px;
    left: 50%;
    transform: translateX(-50%);
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--amber);
  }
  .day.ready .dot {
    background: var(--green);
    animation: pulse 2s infinite;
  }
  .day.selected .dot {
    background: #fff;
    animation: none;
  }
  .day.anim { animation: pop .45s var(--ease) both; animation-delay: var(--d, 0ms); }
  .day-empty { width: 100%; height: 46px; }

  .legend {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px 24px;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: .8rem;
    color: var(--muted);
    width: 100%;
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .legend .l-ready { background: var(--green); }
  .legend .l-up { background: var(--amber); }
  .legend .l-today { box-shadow: inset 0 0 0 2px var(--gold); }

  /* ============ Results ============ */
  .res-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-bottom: 16px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
  .res-eyebrow { display: block; font-size: .7rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); margin-bottom: 4px; }
  .res-date { margin: 0; display: flex; align-items: center; gap: 8px; font-size: clamp(1.1rem, 2.6vw, 1.35rem); font-weight: 800; color: var(--primary); }
  .count-badge { background: rgba(0, 78, 139, .08); color: var(--primary); font-size: .78rem; font-weight: 700; padding: 6px 13px; border-radius: 999px; }
  .cards { display: grid; gap: 16px; min-width: 0; }
  .event {
    background: rgba(255, 255, 255, .9); border: 1px solid var(--line); border-radius: 20px; padding: 20px;
    display: grid; gap: 16px; scroll-margin-top: 100px;
    transition: transform .35s var(--ease), box-shadow .35s, border-color .3s;
    animation: fadeUp .7s var(--ease) both;
    min-width: 0;
  }
  .event:hover { transform: translateY(-3px); box-shadow: 0 18px 36px -22px rgba(16, 40, 70, .35); border-color: #d9e2ee; }
  .event.shared { border-color: var(--gold); box-shadow: 0 0 0 5px rgba(219, 155, 0, .14); background: #fffdf6; }

  .event-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { display: inline-flex; align-items: center; gap: 5px; padding: 4px 11px; border-radius: 999px; font-size: .72rem; font-weight: 700; }
  .tag.gold { background: rgba(219, 155, 0, .14); color: #a97500; }
  .tag.blue { background: rgba(0, 78, 139, .08); color: var(--primary); }
  .tag.amber { background: rgba(245, 158, 11, .14); color: #b36b00; }
  .tag.soon { background: #eef2f8; color: var(--muted); }

  .share-btn {
    display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: #fff; color: var(--blue);
    padding: 6px 14px; border-radius: 999px; font-size: .74rem; font-weight: 700; transition: all .25s var(--ease);
  }
  .share-btn:hover { border-color: var(--gold); color: var(--gold); transform: translateY(-1px); }

  .event-title { margin: 0; font-size: clamp(1rem, 2.2vw, 1.16rem); font-weight: 700; color: var(--primary); line-height: 1.4; }
  .event-loc { display: flex; align-items: flex-start; gap: 6px; margin: 6px 0 0; font-size: .82rem; color: var(--muted); }
  .event-loc .ico { color: var(--gold); margin-top: 3px; }

  .dl {
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    padding: 14px 16px; border-radius: 16px; background: linear-gradient(135deg, #f8fafd, #fff); border: 1px solid var(--line);
  }
  .dl-info { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .dl-icon { width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: rgba(219, 155, 0, .12); color: var(--gold); border: 1px solid rgba(219, 155, 0, .22); font-size: 1.3rem; flex-shrink: 0; }
  .dl-count { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .dl-count b { font-size: 1.55rem; font-weight: 800; color: var(--primary); line-height: 1; }
  .dl-count span { font-size: .8rem; font-weight: 700; color: var(--muted); }
  .dl-note { margin: 3px 0 0; font-size: .7rem; color: #8993a2; }
  .dl-soon { font-size: .84rem; color: var(--muted); display: flex; align-items: center; gap: 8px; }

  .btn-dl {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 2px solid transparent;
    padding: 11px 20px; border-radius: 16px; background: var(--blue); color: #fff; font-size: .84rem; font-weight: 800;
    box-shadow: 0 10px 22px -10px rgba(0, 114, 187, .75);
    transition: transform .3s var(--ease), background .3s, color .3s, border-color .3s, box-shadow .3s;
  }
  .btn-dl .ico { font-size: 1.15rem; }
  .btn-dl:hover { background: #fff; color: var(--blue); border-color: var(--gold); transform: translateY(-2px); box-shadow: 0 14px 26px -14px rgba(219, 155, 0, .7); }
  .btn-dl:active { transform: translateY(0) scale(.98); }
  .btn-dl.locked { background: var(--amber); box-shadow: 0 10px 22px -10px rgba(245, 158, 11, .8); }
  .btn-dl.locked:hover { background: #fff; color: #b36b00; }
  @media (max-width: 560px) { .btn-dl { width: 100%; } }

  .footnote { margin: 20px 0 0; text-align: center; font-size: .72rem; color: #8993a2; }

  .empty { padding: 56px 12px; text-align: center; display: grid; justify-items: center; gap: 14px; animation: fadeUp .6s var(--ease) both; }
  .empty-icon { width: 76px; height: 76px; border-radius: 50%; background: #eef2f8; color: #aeb9c9; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; animation: bob 4s ease-in-out infinite; }
  .empty h4 { margin: 0; font-size: 1.05rem; color: var(--primary); }
  .empty p { margin: 0; font-size: .84rem; color: var(--muted); max-width: 320px; }

  /* ============ Skeleton ============ */
  .sk { position: relative; overflow: hidden; background: #edf1f7; border-radius: 10px; }
  .sk::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .75), transparent); animation: shimmer 1.5s infinite; }
  .sk-stack { display: grid; gap: 14px; }
  .sk-row { display: flex; gap: 8px; overflow: hidden; }
  .sk-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px 10px; }
  .sk-round { height: 48px; border-radius: 14px; width: 100%; }
  .content-in { animation: fadeUp .7s var(--ease) both; }

  /* ============ Modal ============ */
  .modal {
    position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 20px;
    background: rgba(12, 24, 40, 0); backdrop-filter: blur(0); -webkit-backdrop-filter: blur(0);
    transition: background .3s, backdrop-filter .3s;
  }
  .modal.open { background: rgba(12, 24, 40, .45); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .dialog {
    width: 100%; max-width: 380px; background: #fff; border-radius: 28px; padding: 28px 24px 22px; text-align: center;
    box-shadow: 0 30px 70px -20px rgba(8, 20, 40, .5); display: grid; gap: 12px;
    opacity: 0; transform: translateY(20px) scale(.95); transition: opacity .3s, transform .4s var(--ease);
  }
  .modal.open .dialog { opacity: 1; transform: none; }
  .dialog.shake { animation: shake .45s; }
  .lock-badge { width: 56px; height: 56px; margin: 0 auto; border-radius: 50%; background: var(--amber-soft); color: #c77d00; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; }
  .dialog h3 { margin: 4px 0 0; font-size: 1.1rem; }
  .dialog p { margin: 0; font-size: .84rem; color: var(--muted); }
  .pw-input {
    width: 100%; padding: 13px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: #f8fafc;
    text-align: center; font-size: 1rem; font-family: ui-monospace, Menlo, Consolas, monospace; transition: border-color .2s, box-shadow .2s;
  }
  .pw-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(0, 78, 139, .12); background: #fff; }
  .pw-input.bad { border-color: var(--danger); box-shadow: 0 0 0 4px rgba(224, 69, 47, .12); }
  .pw-error { min-height: 1.1em; font-size: .76rem; color: var(--danger); font-weight: 600; }
  .dialog-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
  .btn { border: 0; border-radius: 999px; padding: 12px; font-size: .84rem; font-weight: 700; transition: transform .25s var(--ease), background .25s, box-shadow .25s; }
  .btn:active { transform: scale(.97); }
  .btn.ghost { background: #eef2f8; color: var(--muted); }
  .btn.ghost:hover { background: #e2e9f3; }
  .btn.solid { background: var(--primary); color: #fff; box-shadow: 0 10px 20px -10px rgba(0, 78, 139, .8); }
  .btn.solid:hover { background: var(--primary-2); transform: translateY(-1px); }

  /* ============ Toast ============ */
  .toast {
    position: fixed; z-index: 80; left: 50%; bottom: 24px; max-width: calc(100vw - 32px);
    display: flex; align-items: center; gap: 10px; padding: 13px 20px; border-radius: 18px;
    background: rgba(18, 28, 42, .94); color: #fff; font-size: .84rem; font-weight: 600;
    box-shadow: 0 20px 40px -12px rgba(0, 0, 0, .45); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transform: translate(-50%, 30px); opacity: 0; pointer-events: none; transition: transform .45s var(--ease), opacity .3s;
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }
  .toast .ico { font-size: 1.3rem; color: #4ade80; }
  .toast.error .ico { color: #ff8a78; }

  /* ============ Keyframes ============ */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-100%); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
  @keyframes shimmer { to { transform: translateX(100%); } }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(15, 157, 107, .55); } 70% { box-shadow: 0 0 0 6px rgba(15, 157, 107, 0); } 100% { box-shadow: 0 0 0 0 rgba(15, 157, 107, 0); } }
  @keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

  @media (max-width: 480px) {
    .wrap { padding: 0 14px; }
    .panel { padding: 16px; border-radius: 20px; }
    .weekdays, .days { gap: 4px; }
    .day { height: 42px; font-size: .88rem; border-radius: 10px; }
    .day-empty { height: 42px; }
    .hero { padding-top: 24px; }
    .event { padding: 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  }
</style>

<script>
(function () {
  'use strict';

  /* ============ Config ============ */
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby1Jp5luNHA7vaaGmYPCnlsE7CHM1HXhP2mCClW3tLxWlH0A1U54IpTLuOSvNvqG7QJVw/exec";

  const THAI_MONTHS = [
    "มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน",
    "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"
  ];

  // ข้อมูลสำรอง (ใช้เมื่อโหลดจากเซิร์ฟเวอร์ไม่ได้)
  const DEFAULT_DB = {
    "2026-01-10": [{
      id: "act-1", title: "กิจกรรมจิตอาสาส่งมอบรอยยิ้มวันเด็กแห่งชาติ 2569",
      time: "08:30 น. - 12:30 น.", location: "ณ โรงเรียนวัดร้องซ้อ จังหวัดลำพูน", imageCount: 45,
      folderUrl: "https://onedrive.live.com/embed?resid=8F99649728BEB2F3!101&authkey=!ANtMXD_CHILD1",
      password: "", isUpcoming: false
    }],
    "2026-02-14": [{
      id: "act-2", title: "งานสัมมนาทิศทางและยุทธศาสตร์ขับเคลื่อนสื่อดิจิทัลภาคเหนือ",
      time: "13:00 น. - 16:30 น.", location: "ห้องประชุมพายัพภิรมย์ อาคารศูนย์เทคโนโลยีสารสนเทศ", imageCount: 120,
      folderUrl: "https://onedrive.live.com/embed?resid=8F99649728BEB2F3!102&authkey=!ANtMXD_CHILD2",
      password: "", isUpcoming: false
    }],
    "2026-06-15": [{
      id: "act-3", title: "พิธีนมัสการและปฐมนิเทศนักศึกษาใหม่ ประจำปีการศึกษา 2569",
      time: "08:00 น. - 12:00 น.", location: "โบสถ์เล่ากวง และห้องประชุมกลาง มหาวิทยาลัยพายัพ", imageCount: 350,
      folderUrl: "https://onedrive.live.com/embed?resid=8F99649728BEB2F3!103&authkey=!ANtMXD_CHILD3",
      password: "", isUpcoming: false
    }]
  };

  /* ============ Icons (static inline SVG) ============ */
  const ICONS = {
    calendar: '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/>',
    chevL: '<path d="m15 6-6 6 6 6"/>',
    chevR: '<path d="m9 6 6 6-6 6"/>',
    share: '<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 10.5 6.8-4M8.6 13.5l6.8 4"/>',
    lock: '<rect x="4" y="11" width="16" height="10" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
    download: '<path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/>',
    folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    pin: '<path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
    check: '<circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16 9.5"/>',
    alert: '<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/>',
    empty: '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18M10 14l4 4M14 14l-4 4"/>',
    sparkle: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
    image: '<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/>'
  };
  const svg = (name) => '<svg viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || '') + '</svg>';

  /* ============ Helpers ============ */
  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, '0');
  const makeKey = (y, m, d) => y + '-' + pad(m + 1) + '-' + pad(d);

  // สร้าง element ปลอดภัย
  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    Object.entries(props || {}).forEach(([k, v]) => {
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k === 'style') el.style.cssText = v;
      else if (k === 'on') Object.entries(v).forEach(([ev, fn]) => el.addEventListener(ev, fn));
      else el.setAttribute(k, v);
    });
    kids.flat().forEach((c) => { if (c !== null && c !== undefined && c !== false) el.append(c); });
    return el;
  }
  function ic(name) {
    const s = document.createElement('span');
    s.className = 'ico';
    s.innerHTML = svg(name);
    return s;
  }

  function safeUrl(u) {
    try {
      const p = new URL(String(u));
      return p.protocol === 'https:' ? p.href : '';
    } catch (e) { return ''; }
  }

  /* ============ State ============ */
  let db = {};
  const now = new Date();
  let year = now.getFullYear();
  let monthIdx = now.getMonth();
  let dateKey = makeKey(year, monthIdx, now.getDate());
  const todayKey = dateKey;
  let sharedId = null;
  let activePassword = '';
  let activeUrl = '';
  let lastFocus = null;
  let toastTimer = null;

  try {
    const params = new URLSearchParams(window.location.search);
    const qDate = params.get('date');
    const qId = params.get('id');
    if (qDate && /^\d{4}-\d{2}-\d{2}$/.test(qDate)) {
      dateKey = qDate;
      const parts = qDate.split('-');
      year = parseInt(parts[0], 10);
      monthIdx = parseInt(parts[1], 10) - 1;
      if (qId) sharedId = qId;
    }
  } catch (e) { /* ignore */ }

  /* ============ Data loading ============ */
  async function fetchJson(url) {
    const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = setTimeout(() => ctrl && ctrl.abort(), 8000);
    try {
      const res = await fetch(url, { cache: 'no-cache', signal: ctrl ? ctrl.signal : undefined });
      if (!res.ok) return null;
      return await res.json();
    } finally { clearTimeout(timer); }
  }
  const isValidDb = (d) => d && typeof d === 'object' && !Array.isArray(d) && Object.keys(d).length > 0;

  async function loadDatabase() {
    if (GOOGLE_SCRIPT_URL) {
      try {
        const d = await fetchJson(GOOGLE_SCRIPT_URL);
        if (isValidDb(d)) { db = d; return; }
      } catch (e) { console.warn('Unable to fetch from Google Sheets API, checking fallback...', e); }
    }
    try {
      const d = await fetchJson('data.json');
      if (isValidDb(d)) { db = d; return; }
    } catch (e) { console.warn('data.json not found, using default data'); }
    db = JSON.parse(JSON.stringify(DEFAULT_DB));
  }

  const eventsOf = (key) => (key && Array.isArray(db[key]) ? db[key] : []);
  const hasEvents = (key) => eventsOf(key).length > 0;

  /* ============ Month chips ============ */
  function monthHasEvents(m) {
    const prefix = year + '-' + pad(m + 1);
    return Object.keys(db).some((k) => k.startsWith(prefix) && hasEvents(k));
  }

  function renderMonths() {
    const box = $('months');
    box.replaceChildren();
    THAI_MONTHS.forEach((name, idx) => {
      const cls = 'chip-month' + (idx === monthIdx ? ' active' : '') + (monthHasEvents(idx) ? ' has' : '');
      box.append(h('button', {
        type: 'button', class: cls, text: name, role: 'tab',
        'aria-selected': idx === monthIdx ? 'true' : 'false',
        on: { click: () => selectMonth(idx) }
      }));
    });
    $('year-label').textContent = 'พ.ศ. ' + (year + 543);

    requestAnimationFrame(() => {
      const active = box.querySelector('.active');
      if (active) {
        box.scrollTo({ left: active.offsetLeft - box.clientWidth / 2 + active.clientWidth / 2, behavior: 'smooth' });
      }
    });
  }

  /* ============ Calendar grid ============ */
  function renderCalendar(animate) {
    const grid = $('days');
    grid.replaceChildren();
    $('cal-label').textContent = THAI_MONTHS[monthIdx];

    const startDay = new Date(year, monthIdx, 1).getDay();
    const total = new Date(year, monthIdx + 1, 0).getDate();

    for (let i = 0; i < startDay; i++) grid.append(h('div', { class: 'day-empty' }));

    for (let d = 1; d <= total; d++) {
      const key = makeKey(year, monthIdx, d);
      const evs = eventsOf(key);
      let cls = 'day';

      if (key === todayKey) cls += ' is-today';
      if (animate) cls += ' anim';

      const ready = evs.some((e) => !e.isUpcoming && e.folderUrl);
      const upcomingOnly = evs.length > 0 && evs.every((e) => e.isUpcoming);

      if (key === dateKey) cls += ' selected';
      else if (evs.length) cls += ready ? ' ready' : (upcomingOnly ? ' upcoming' : ' other');

      const btn = h('button', {
        type: 'button', class: cls, text: String(d),
        'aria-label': d + ' ' + THAI_MONTHS[monthIdx] + ' ' + (year + 543) + (evs.length ? ' มี ' + evs.length + ' กิจกรรม' : ''),
        'aria-pressed': key === dateKey ? 'true' : 'false',
        style: animate ? '--d:' + Math.min(d * 9, 300) + 'ms' : '',
        on: { click: () => selectDate(key) }
      });
      if (evs.length) btn.append(h('span', { class: 'dot' }));
      grid.append(btn);
    }
  }

  /* ============ Navigation actions ============ */
  function pickFirstDateOfMonth() {
    const prefix = year + '-' + pad(monthIdx + 1);
    const matches = Object.keys(db).filter((k) => k.startsWith(prefix) && hasEvents(k)).sort();
    dateKey = matches.length ? matches[0] : null;
  }

  function selectMonth(idx) {
    monthIdx = idx;
    sharedId = null;
    pickFirstDateOfMonth();
    renderMonths();
    renderCalendar(true);
    renderDetails();
  }

  function changeYear(delta) {
    year += delta;
    sharedId = null;
    pickFirstDateOfMonth();
    renderMonths();
    renderCalendar(true);
    renderDetails();
  }

  function selectDate(key) {
    dateKey = key;
    sharedId = null;
    renderCalendar(false);
    renderDetails();
  }

  function goToday() {
    const t = new Date();
    year = t.getFullYear();
    monthIdx = t.getMonth();
    dateKey = makeKey(year, monthIdx, t.getDate());
    sharedId = null;
    renderMonths();
    renderCalendar(true);
    renderDetails();
  }

  /* ============ Event details ============ */
  function renderDetails() {
    const box = $('cards-box');
    box.replaceChildren();
    const events = eventsOf(dateKey);

    if (!events.length) {
      const monthCount = monthHasEvents(monthIdx);
      box.append(h('div', { class: 'empty' },
        h('div', { class: 'empty-icon' }, ic('empty')),
        h('h4', { text: 'ไม่พบรูปภาพกิจกรรมในวันดังกล่าว' }),
        h('p', { text: monthCount ? 'ลองเลือกวันที่ที่มีเครื่องหมายสีในปฏิทิน' : 'เดือนนี้ยังไม่มีกิจกรรมในระบบ ลองเลือกเดือนอื่นดูนะครับ' })
      ));
      return;
    }

    const p = dateKey.split('-');
    const thaiDate = parseInt(p[2], 10) + ' ' + THAI_MONTHS[parseInt(p[1], 10) - 1] + ' พ.ศ. ' + (parseInt(p[0], 10) + 543);

    box.append(h('div', { class: 'res-head' },
      h('div', {},
        h('span', { class: 'res-eyebrow', text: 'กิจกรรมในระบบ' }),
        h('h2', { class: 'res-date' }, ic('calendar'), thaiDate)
      ),
      h('span', { class: 'count-badge', text: 'ทั้งหมด ' + events.length + ' กิจกรรม' })
    ));

    const list = h('div', { class: 'cards' });
    const currentKey = dateKey;

    events.forEach((ev, i) => {
      const evId = String(ev.id || ('ev-' + i));
      const isShared = sharedId !== null && sharedId === evId;
      const url = safeUrl(ev.folderUrl);
      const password = ev.password ? String(ev.password) : '';

      const tags = h('div', { class: 'tags' },
        h('span', { class: 'tag gold' }, ic('sparkle'), 'กิจกรรมที่ ' + (i + 1)),
        ev.time ? h('span', { class: 'tag blue' }, ic('clock'), String(ev.time)) : null,
        password ? h('span', { class: 'tag amber' }, ic('lock'), 'อัลบั้มล็อกรหัสผ่าน') : null,
        ev.isUpcoming ? h('span', { class: 'tag soon' }, 'เร็วๆ นี้') : null
      );

      const shareBtn = h('button', { type: 'button', class: 'share-btn', on: { click: () => copyShareLink(currentKey, evId) } },
        ic('share'), 'แชร์ลิงก์งานนี้');

      let panel;
      if (!ev.isUpcoming) {
        const btn = password
          ? h('button', { type: 'button', class: 'btn-dl locked', on: { click: () => requestPassword(password, url) } },
              ic('lock'), 'ดาวน์โหลด (ต้องใช้รหัสผ่าน)')
          : h('button', { type: 'button', class: 'btn-dl', on: { click: () => openLink(url) } },
              ic('download'), 'ดาวน์โหลดรูปภาพทั้งหมด');

        panel = h('div', { class: 'dl' },
          h('div', { class: 'dl-info' },
            h('div', { class: 'dl-icon' }, ic('folder')),
            h('div', {},
              h('div', { class: 'dl-count' },
                h('b', { text: Number(ev.imageCount || 0).toLocaleString('th-TH') }),
                h('span', { text: 'รูปภาพพร้อมดาวน์โหลด' })),
              h('p', { class: 'dl-note', text: 'ไฟล์ความละเอียดสูงบนคลาวด์' })
            )
          ),
          btn
        );
      } else {
        panel = h('div', { class: 'dl' },
          h('div', { class: 'dl-soon' }, ic('clock'), 'รูปภาพจะพร้อมให้ดาวน์โหลดหลังจบกิจกรรม')
        );
      }

      const card = h('article', {
        class: 'event' + (isShared ? ' shared' : ''), id: evId,
        style: 'animation-delay:' + (i * 90) + 'ms'
      },
        h('div', { class: 'event-top' }, tags, shareBtn),
        h('div', {},
          h('h3', { class: 'event-title', text: String(ev.title || '') }),
          ev.location ? h('p', { class: 'event-loc' }, ic('pin'), String(ev.location)) : null
        ),
        panel
      );
      list.append(card);
    });

    box.append(list);
    box.append(h('p', { class: 'footnote', text: 'หมายเหตุ: เมื่อกดปุ่มดาวน์โหลด ระบบจะนำพาเข้าสู่โฟลเดอร์ฝากไฟล์ของ OneDrive เพื่อให้เลือกดาวน์โหลดไฟล์จริงแยกได้ตามต้องการครับ' }));
  }

  /* ============ Download / password ============ */
  function openLink(url) {
    if (!url) { toast('ยังไม่มีลิงก์ดาวน์โหลดสำหรับกิจกรรมนี้', 'error'); return; }
    window.open(url, '_blank', 'noopener,noreferrer');
  }

  function requestPassword(password, url) {
    activePassword = password;
    activeUrl = url;
    lastFocus = document.activeElement;

    const modal = $('password-modal');
    const input = $('pw-input');
    input.value = '';
    input.classList.remove('bad');
    $('pw-error').textContent = '';
    modal.hidden = false;
    requestAnimationFrame(() => {
      modal.classList.add('open');
      input.focus();
    });
  }

  function closePasswordModal() {
    const modal = $('password-modal');
    modal.classList.remove('open');
    setTimeout(() => { modal.hidden = true; }, 260);
    activePassword = '';
    activeUrl = '';
    if (lastFocus && typeof lastFocus.focus === 'function') lastFocus.focus();
  }

  function verifyPassword() {
    const input = $('pw-input');
    const entered = input.value.trim();
    if (entered !== '' && entered === activePassword) {
      const url = activeUrl;
      toast('รหัสผ่านถูกต้อง กำลังเปิดลิงก์ดาวน์โหลด...', 'success');
      closePasswordModal();
      openLink(url);
    } else {
      input.classList.add('bad');
      $('pw-error').textContent = 'รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง';
      const dlg = $('pw-dialog');
      dlg.classList.remove('shake');
      void dlg.offsetWidth;
      dlg.classList.add('shake');
      toast('รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง', 'error');
      input.select();
    }
  }

  /* ============ Share link ============ */
  function buildShareUrl(key, id) {
    let base = '';
    try {
      base = window.location.origin && window.location.origin !== 'null'
        ? window.location.origin + window.location.pathname
        : window.location.href.split('?')[0].split('#')[0];
    } catch (e) { base = ''; }
    return base + '?date=' + encodeURIComponent(key) + '&id=' + encodeURIComponent(id);
  }

  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  async function copyShareLink(key, id) {
    const text = buildShareUrl(key, id);
    let ok = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        ok = true;
      }
    } catch (e) { ok = false; }
    if (!ok) ok = fallbackCopy(text);

    if (ok) toast('คัดลอกลิงก์เฉพาะกิจกรรมนี้สำเร็จ! ส่งให้ไลน์อาจารย์ได้ทันทีครับ', 'success');
    else toast('ไม่สามารถคัดลอกลิงก์อัตโนมัติได้ กรุณาคัดลอกด้วยตนเอง', 'error');
  }

  /* ============ Toast ============ */
  function toast(message, type) {
    const el = $('toast');
    $('toast-text').textContent = message;
    const icon = $('toast-icon');
    const isError = type === 'error';
    icon.innerHTML = svg(isError ? 'alert' : 'check');
    el.classList.toggle('error', isError);
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
  }

  /* ============ Init ============ */
  function handleLogoFallbacks() {
    document.querySelectorAll('img[data-logo]').forEach((img) => {
      const fail = () => {
        if (img.dataset.logo === 'brand') {
          const fb = document.createElement('div');
          fb.className = 'logo-fallback';
          fb.innerHTML = '<span>OMC</span><small>PYU</small>';
          img.replaceWith(fb);
        } else {
          img.style.display = 'none';
        }
      };
      img.addEventListener('error', fail, { once: true });
      if (img.complete && img.naturalWidth === 0) fail();
    });
  }

  function trapFocus(e) {
    if (e.key !== 'Tab') return;
    const items = $('password-modal').querySelectorAll('input, button');
    if (!items.length) return;
    const first = items[0];
    const last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }

  function revealContent() {
    $('calendar-skeleton').hidden = true;
    $('cards-skeleton').hidden = true;
    const cal = $('calendar-box');
    const cards = $('cards-box');
    cal.hidden = false;
    cards.hidden = false;
    cal.classList.add('content-in');
    cards.classList.add('content-in');
    $('year-stepper').hidden = false;
  }

  document.addEventListener('DOMContentLoaded', async function () {
    // Hydrate static icons
    document.querySelectorAll('[data-i]').forEach((el) => { el.innerHTML = svg(el.getAttribute('data-i')); });
    handleLogoFallbacks();

    // Static listeners
    $('year-prev').addEventListener('click', () => changeYear(-1));
    $('year-next').addEventListener('click', () => changeYear(1));
    $('today-btn').addEventListener('click', goToday);
    $('pw-cancel').addEventListener('click', closePasswordModal);
    $('pw-submit').addEventListener('click', verifyPassword);
    $('pw-input').addEventListener('input', () => {
      $('pw-input').classList.remove('bad');
      $('pw-error').textContent = '';
    });
    $('pw-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') verifyPassword(); });
    $('password-modal').addEventListener('click', (e) => { if (e.target === $('password-modal')) closePasswordModal(); });
    document.addEventListener('keydown', (e) => {
      if ($('password-modal').hidden) return;
      if (e.key === 'Escape') closePasswordModal();
      else trapFocus(e);
    });

    // Load data
    await Promise.all([loadDatabase(), new Promise((r) => setTimeout(r, 650))]);

    revealContent();
    renderMonths();
    renderCalendar(true);
    renderDetails();

    if (sharedId) {
      setTimeout(() => {
        const target = document.getElementById(sharedId);
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 600);
    }
  });
})();
</script>
</body>
</html>
