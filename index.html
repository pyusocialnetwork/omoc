<!DOCTYPE html>
<html class="light" lang="th">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>คลังจัดเก็บภาพ สำนักงานการตลาดและสื่อสารองค์กร มหาวิทยาลัยพายัพ</title>
    <!-- Tailwind CSS for modern responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- GSAP (GreenSock Animation Platform) for high-performance premium animations -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    
    <!-- Premium Fonts - Including Noto Sans Thai & Sarabun as modern sans-serif fallbacks for Google Sans Thai -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "surface": "#f9f9fc",
                        "primary": "#004e8b",
                        "primary-container": "#0066b3",
                        "secondary-fixed": "#ffdea7",
                        "on-surface": "#1a1c1e",
                        "on-surface-variant": "#414751"
                    },
                    fontFamily: {
                        "sans": ["Google Sans Thai", "Noto Sans Thai", "Sarabun", "sans-serif"],
                        "google-sans": ["Google Sans Thai", "Noto Sans Thai", "Sarabun", "sans-serif"]
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Google Sans Thai', 'Noto Sans Thai', 'Sarabun', sans-serif;
        }
        .gradient-bg {
            background: linear-gradient(135deg, rgba(255,255,255,1) 0%, rgba(249,249,252,1) 40%, rgba(212,153,0,0.01) 100%);
            position: relative;
            overflow: hidden;
        }
        .content-layer {
            position: relative;
            z-index: 10;
        }
    </style>
</head>
<body class="bg-surface text-on-surface h-screen flex flex-col gradient-bg overflow-hidden justify-center items-center">

    <!-- Floating Logo Background (Faint, Super-Oversized, and Overflowing Pattern) -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none z-0">
        <!-- Logo 1 (Super-Oversized - Top Left Corner Cutout) -->
        <img alt="OMOC Watermark Background" 
             class="bg-logo-element bg-logo-1 absolute w-[1000px] sm:w-[1800px] opacity-[0.035] select-none filter blur-[1px]" 
             src="https://lh3.googleusercontent.com/aida-public/AB6AXuB9SJSQUgIoHn8_wxke2-yYluqHi6eamoTmDS2ZbyZr9luNW9BHTzWP1fyIiuZly-IwRZ_wgVrgsv5IdOEmx5Ml1Lt72dxcBFCnWkNxqumrwo1vfJveQQvkLTLaqKkLKLX_yPUyquY-zegzbF51Mt7Bp4FEacjxtIgsr0mEmZLBSzeRCIcT4xBi23fX7zg4fRP7n90IJgKynCRbKmo0XHE3KgrvK6ihDv4re4-GB2u_IqhitBH_EPPJeKKMsz6sKfm7"
             style="top: -45%; left: -35%;"
             onerror="this.style.display='none'">
             
        <!-- Logo 2 (Super-Oversized - Right Edge Cutout) -->
        <img alt="OMOC Watermark Background" 
             class="bg-logo-element bg-logo-2 absolute w-[1200px] sm:w-[2200px] opacity-[0.04] select-none" 
             src="https://lh3.googleusercontent.com/aida-public/AB6AXuB9SJSQUgIoHn8_wxke2-yYluqHi6eamoTmDS2ZbyZr9luNW9BHTzWP1fyIiuZly-IwRZ_wgVrgsv5IdOEmx5Ml1Lt72dxcBFCnWkNxqumrwo1vfJveQQvkLTLaqKkLKLX_yPUyquY-zegzbF51Mt7Bp4FEacjxtIgsr0mEmZLBSzeRCIcT4xBi23fX7zg4fRP7n90IJgKynCRbKmo0XHE3KgrvK6ihDv4re4-GB2u_IqhitBH_EPPJeKKMsz6sKfm7"
             style="top: 15%; right: -45%;"
             onerror="this.style.display='none'">

        <!-- Logo 3 (Super-Oversized - Bottom Left Corner Cutout) -->
        <img alt="OMOC Watermark Background" 
             class="bg-logo-element bg-logo-3 absolute w-[900px] sm:w-[1600px] opacity-[0.03] select-none filter blur-[2px]" 
             src="https://lh3.googleusercontent.com/aida-public/AB6AXuB9SJSQUgIoHn8_wxke2-yYluqHi6eamoTmDS2ZbyZr9luNW9BHTzWP1fyIiuZly-IwRZ_wgVrgsv5IdOEmx5Ml1Lt72dxcBFCnWkNxqumrwo1vfJveQQvkLTLaqKkLKLX_yPUyquY-zegzbF51Mt7Bp4FEacjxtIgsr0mEmZLBSzeRCIcT4xBi23fX7zg4fRP7n90IJgKynCRbKmo0XHE3KgrvK6ihDv4re4-GB2u_IqhitBH_EPPJeKKMsz6sKfm7"
             style="top: 45%; left: -30%;"
             onerror="this.style.display='none'">

        <!-- Logo 4 (Super-Oversized - Top Right Edge Cutout) -->
        <img alt="OMOC Watermark Background" 
             class="bg-logo-element bg-logo-4 absolute w-[1100px] sm:w-[2000px] opacity-[0.035] select-none" 
             src="https://lh3.googleusercontent.com/aida-public/AB6AXuB9SJSQUgIoHn8_wxke2-yYluqHi6eamoTmDS2ZbyZr9luNW9BHTzWP1fyIiuZly-IwRZ_wgVrgsv5IdOEmx5Ml1Lt72dxcBFCnWkNxqumrwo1vfJveQQvkLTLaqKkLKLX_yPUyquY-zegzbF51Mt7Bp4FEacjxtIgsr0mEmZLBSzeRCIcT4xBi23fX7zg4fRP7n90IJgKynCRbKmo0XHE3KgrvK6ihDv4re4-GB2u_IqhitBH_EPPJeKKMsz6sKfm7"
             style="top: -55%; right: -20%;"
             onerror="this.style.display='none'">

        <!-- Logo 5 (Super-Oversized - Center Left Edge Cutout) -->
        <img alt="OMOC Watermark Background" 
             class="bg-logo-element bg-logo-5 absolute w-[950px] sm:w-[1700px] opacity-[0.032] select-none" 
             src="https://lh3.googleusercontent.com/aida-public/AB6AXuB9SJSQUgIoHn8_wxke2-yYluqHi6eamoTmDS2ZbyZr9luNW9BHTzWP1fyIiuZly-IwRZ_wgVrgsv5IdOEmx5Ml1Lt72dxcBFCnWkNxqumrwo1vfJveQQvkLTLaqKkLKLX_yPUyquY-zegzbF51Mt7Bp4FEacjxtIgsr0mEmZLBSzeRCIcT4xBi23fX7zg4fRP7n90IJgKynCRbKmo0XHE3KgrvK6ihDv4re4-GB2u_IqhitBH_EPPJeKKMsz6sKfm7"
             style="top: 10%; left: -35%;"
             onerror="this.style.display='none'">
    </div>

    <!-- Main Content Area -->
    <main id="view-landing" class="content-layer w-full max-w-lg md:max-w-6xl px-6 flex flex-col md:flex-row items-center justify-center text-center md:text-left gap-8 md:gap-16">
        
        <!-- Logo Container -->
        <div id="logo-container" class="relative flex justify-center items-center w-full max-w-sm md:max-w-md transition-all opacity-0">
            <div class="absolute inset-0 bg-primary/5 rounded-3xl blur-2xl transform scale-90"></div>
            <img alt="OMOC Organization Media" 
                 class="w-full h-36 sm:h-44 object-contain relative z-10 filter drop-shadow-sm rounded-2xl" 
                 src="https://lh3.googleusercontent.com/aida-public/AB6AXuB9SJSQUgIoHn8_wxke2-yYluqHi6eamoTmDS2ZbyZr9luNW9BHTzWP1fyIiuZly-IwRZ_wgVrgsv5IdOEmx5Ml1Lt72dxcBFCnWkNxqumrwo1vfJveQQvkLTLaqKkLKLX_yPUyquY-zegzbF51Mt7Bp4FEacjxtIgsr0mEmZLBSzeRCIcT4xBi23fX7zg4fRP7n90IJgKynCRbKmo0XHE3KgrvK6ihDv4re4-GB2u_IqhitBH_EPPJeKKMsz6sKfm7" 
                 onerror="this.src='https://placehold.co/400x150/004e8b/ffffff?text=OMOC+Media+Group'">
        </div>

        <!-- Action CTAs Container -->
        <div id="cta-button-container" class="opacity-0 w-full md:w-auto flex flex-col items-center justify-center md:items-start gap-4">
            
            <!-- Disabled Assessment Button (No extra text, clean lock icon) -->
            <button disabled 
                    type="button" 
                    aria-disabled="true"
                    class="bg-slate-200/90 border-2 border-slate-300/60 text-slate-400 cursor-not-allowed pointer-events-none select-none px-8 py-4 flex items-center justify-center gap-2 w-full sm:w-auto min-w-[260px] rounded-full text-base sm:text-lg font-bold font-google-sans shadow-none">
                เริ่มต้นทำแบบประเมิน
                <span class="material-symbols-outlined text-slate-400">lock</span>
            </button>

            <!-- Gallery Calendar Link Button (Updated to Cloudflare Pages Domain) -->
            <a href="https://omoc.pages.dev/gallery" 
               class="bg-primary border-2 border-transparent hover:bg-white hover:border-[#DB9B00] hover:text-[#0072BB] text-white transition-all duration-300 px-8 py-4 shadow-[0_4px_14px_0_rgba(0,78,139,0.35)] hover:shadow-[0_6px_22px_rgba(219,155,0,0.5)] hover:-translate-y-1 flex items-center justify-center gap-2 w-full sm:w-auto min-w-[260px] rounded-full text-base sm:text-lg hover:scale-105 font-bold group font-google-sans">
                ปฏิทินจัดเก็บภาพ
                <span class="material-symbols-outlined transform group-hover:translate-y-0.5 transition-transform">calendar_month</span>
            </a>
            
        </div>
    </main>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            
            // 1. GSAP: Organic Floating Animation for Background Logos
            function animateFloatingLogo(selector, maxMoveX, maxMoveY) {
                gsap.to(selector, {
                    x: `random(${-maxMoveX}, ${maxMoveX})`,
                    y: `random(${-maxMoveY}, ${maxMoveY})`,
                    rotation: "random(-35, 35)",
                    scale: "random(0.85, 1.15)",
                    duration: "random(18, 28)",
                    ease: "sine.inOut",
                    onComplete: () => animateFloatingLogo(selector, maxMoveX, maxMoveY)
                });
            }

            animateFloatingLogo(".bg-logo-1", 280, 220);
            animateFloatingLogo(".bg-logo-2", 240, 280);
            animateFloatingLogo(".bg-logo-3", 300, 240);
            animateFloatingLogo(".bg-logo-4", 220, 250);
            animateFloatingLogo(".bg-logo-5", 290, 270);

            // 2. GSAP: Entrance Animation with Timeline
            const entranceTimeline = gsap.timeline();
            
            entranceTimeline.fromTo("#logo-container", 
                { opacity: 0, y: 35, scale: 0.96 }, 
                { opacity: 1, y: 0, scale: 1, duration: 1.2, ease: "power3.out" }
            );

            entranceTimeline.fromTo("#cta-button-container", 
                { opacity: 0, y: 20 }, 
                { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" },
                "-=0.6"
            );
        });
    </script>

</body>
</html>
